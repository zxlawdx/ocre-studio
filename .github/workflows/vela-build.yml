name: Vela Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      republish:
        description: Replace current release after successful builds
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ocre-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
  OMP_NUM_THREADS: '2'
  VELA_PRODUCTION: '1'
  OCRE_REQUIRE_NATIVE: '1'
  KOKENTAU_RELEASE: 'kokentau-v8.2-models'

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -r requirements-torch.txt
          python -m pip check
      - name: Verify and provision authorized model assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release download "$KOKENTAU_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern 'kokentau-*.zip' --dir "$RUNNER_TEMP/kokentau"; then
            gh release download v0.1.0-alpha --repo "$GITHUB_REPOSITORY" --pattern 'Ocre-Studio-linux-*.zip' --dir "$RUNNER_TEMP/previous"
            python -m tools.model_release "$RUNNER_TEMP/kokentau" --verify docs/manifests/kokentau-v8.2.json --recover-bundle "$RUNNER_TEMP/previous/Ocre-Studio-linux-x86_64-0.1.0-alpha.zip"
          fi
          python -m tools.model_release "$RUNNER_TEMP/kokentau" --verify docs/manifests/kokentau-v8.2.json
          python -m tools.provision_kokentau "$RUNNER_TEMP/kokentau/kokentau-v8.2-checkpoints.zip" "$RUNNER_TEMP/kokentau/kokentau-v8.2-metadata.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-kokentau
          path: ${{ runner.temp }}/kokentau/*.zip
          if-no-files-found: error
          retention-days: 1
      - run: |
          ruff check apps config tests tools manage.py
          ruff format --check apps config tests tools manage.py
          python manage.py collectstatic --yes
          python manage.py assets verify
          python -m tools.patch_vela_self_test
          python manage.py self-test
          python -m pytest -q
          node --test tests/roi.test.mjs
          python -c "from pathlib import Path; from tools.check_runtime_assets import check; check(Path.cwd())"
  build:
    needs: ci
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            gui: gtk
            renderer: gtk
            icon: assets/icons/ocre-studio.png
          - runner: windows-2022
            os: windows
            gui: native
            renderer: edgechromium
            icon: assets/icons/ocre-studio.ico
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VELA_GUI: ${{ matrix.renderer }}
      PYWEBVIEW_GUI: ${{ matrix.renderer }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip xvfb dbus-x11 libgl1-mesa-dri python3-gi python3-cairo gir1.2-gtk-3.0 gir1.2-webkit2-4.1 libwebkit2gtk-4.1-0 rpm
      - name: Install Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH
      - name: Install pinned runtime
        shell: bash
        run: |
          python -m pip install -r requirements.txt -r requirements-build.txt
          python -m pip install -r requirements-torch.txt
          python -m pip check
      - uses: actions/download-artifact@v4
        with:
          name: verified-kokentau
          path: ${{ runner.temp }}/kokentau
      - name: Verify and provision authorized model assets
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.model_release "$RUNNER_TEMP/kokentau" --verify docs/manifests/kokentau-v8.2.json
          python -m tools.provision_kokentau "$RUNNER_TEMP/kokentau/kokentau-v8.2-checkpoints.zip" "$RUNNER_TEMP/kokentau/kokentau-v8.2-metadata.zip"
      - name: Expose GTK bindings after installing pinned Python dependencies
        if: runner.os == 'Linux'
        run: |
          python -c 'import sysconfig; from pathlib import Path; Path(sysconfig.get_path("purelib"), "ocre-system-gi.pth").write_text("/usr/lib/python3/dist-packages\n")'
      - name: Collect distribution notices
        shell: bash
        run: python -m tools.dependency_notices
      - name: Static assets and runtime checks
        shell: bash
        run: |
          python manage.py doctor --gui "${{ matrix.gui }}"
          python manage.py collectstatic --yes
          python manage.py assets verify
          python -m tools.patch_vela_self_test
          python manage.py self-test
          python manage.py buildapp --gui "${{ matrix.gui }}" --icon "${{ matrix.icon }}" --installer --dry-run
      - name: Build and validate native bundle
        shell: bash
        run: |
          args=(--gui "${{ matrix.gui }}" --icon "${{ matrix.icon }}" --plugins --yes)
          if [[ "$RUNNER_OS" == Linux ]]; then args+=(--installer); fi
          python manage.py buildapp "${args[@]}"
      - name: Compile the Windows setup wizard
        if: runner.os == 'Windows'
        run: python -m tools.package_windows
      - name: Exercise GTK WebView on Linux
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: dbus-run-session -- xvfb-run -a -s "-screen 0 1920x1080x24" python -m tools.smoke_gui --native --workspace
      - name: Validate Windows icon and exercise native WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::new((Resolve-Path assets/icons/ocre-studio.ico).Path)
          $icon.Dispose()
          python -m tools.smoke_gui --native --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem dist/Ocre-Studio -Filter Ocre-Studio.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Packaged executable missing' }
          $p = Start-Process -FilePath $exe.FullName -WorkingDirectory $exe.DirectoryName -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(90)
            do {
              Start-Sleep -Seconds 2
              $p.Refresh()
              if ($p.HasExited) { throw "Packaged executable exited: $($p.ExitCode)" }
            } until ($p.MainWindowHandle -ne 0 -or (Get-Date) -gt $deadline)
            if ($p.MainWindowHandle -eq 0) { throw 'No native window' }
            Start-Sleep -Seconds 10
            $p.Refresh()
            if ($p.HasExited) { throw 'Window crashed' }
            if (-not $p.CloseMainWindow()) { throw 'Could not close window' }
            if (-not $p.WaitForExit(30000)) { throw 'Shutdown timed out' }
            if ($p.ExitCode -ne 0) { throw "Exit code: $($p.ExitCode)" }
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }
      - name: Package Linux bundle
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.package_linux
      - name: Remove build-only model inputs
        shell: bash
        run: |
          rm -rf assets/native-models "$RUNNER_TEMP/kokentau"
      - name: Verify all Linux packages in a network namespace
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo -n unshare --net -- bash -euc 'ip link set lo up; exec "$@"' _ \
            runuser -u "$(id -un)" -- env -u OCRE_MODEL_DIR PATH="$PATH" OMP_NUM_THREADS=2 \
            VELA_GUI=gtk PYWEBVIEW_GUI=gtk VELA_PRODUCTION=1 python -m tools.check_distributions dist linux
      - name: Verify Windows setup and ZIP with outbound traffic blocked
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Remove-Item Env:OCRE_MODEL_DIR -ErrorAction SilentlyContinue
          $profiles = @(Get-NetFirewallProfile | Where-Object { $_.Enabled -eq 'False' })
          try {
            foreach ($profile in $profiles) { Set-NetFirewallProfile -Name $profile.Name -Enabled True }
            python -m tools.check_distributions dist windows
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            foreach ($profile in $profiles) { Set-NetFirewallProfile -Name $profile.Name -Enabled False }
          }
      - name: Reject Qt bindings in the frozen bundle
        run: python -m tools.dependency_notices --verify dist/Ocre-Studio
      - name: Check mandatory artifacts and generate checksums
        run: python -m tools.release_artifacts dist ${{ matrix.os }}
      - uses: actions/upload-artifact@v4
        with:
          name: ocre-${{ matrix.os }}
          path: dist/publish/*
          if-no-files-found: error
  release:
    needs: [ci, build]
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.republish) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[republish-alpha]') || contains(github.event.head_commit.message, '[release-alpha]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ocre-*
          path: release
      - name: Verify release version, artifacts and checksums
        run: |
          python -m tools.release_artifacts release/ocre-linux linux --verify
          python -m tools.release_artifacts release/ocre-windows windows --verify
          python -c 'from config.settings import APP_VERSION; import os,re; tag=os.environ["GITHUB_REF_NAME"] if os.environ["GITHUB_REF_TYPE"]=="tag" else f"v{APP_VERSION}"; assert re.fullmatch(r"v\d+\.\d+\.\d+(?:-(?:alpha|beta)(?:\.\d+)?)?",tag) and tag == f"v{APP_VERSION}"'
      - uses: actions/download-artifact@v4
        with:
          name: verified-kokentau
          path: release/models
      - name: Restore the public Kokentau model release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python -m tools.model_release release/models --verify docs/manifests/kokentau-v8.2.json
          cp docs/manifests/kokentau-v8.2.json release/models/kokentau-manifest.json
          cd release/models
          if gh release view "$KOKENTAU_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            gh release download "$KOKENTAU_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern 'kokentau-*' --dir published
            for asset in kokentau-*; do cmp "$asset" "published/$asset"; done
          else
            gh release create "$KOKENTAU_RELEASE" kokentau-* --repo "$GITHUB_REPOSITORY" \
              --verify-tag --title 'Kokentau V8.2' --latest=false \
              --notes 'Checkpoints originais de Marinaldo da Costa Barroso Filho e metadados públicos Kokentau.'
          fi
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(python -c 'from config.settings import APP_VERSION; print("v"+APP_VERSION)')
          if [[ "$GITHUB_REF_TYPE" != tag ]] && gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/ocre-*/* --clobber
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$GITHUB_SHA" -F force=true
            exit 0
          fi
          flags=()
          if [[ "$tag" == *-alpha* || "$tag" == *-beta* ]]; then flags+=(--prerelease); fi
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            flags+=(--verify-tag)
          else
            flags+=(--target "$GITHUB_SHA")
          fi
          gh release create "$tag" release/ocre-*/* --generate-notes "${flags[@]}"
