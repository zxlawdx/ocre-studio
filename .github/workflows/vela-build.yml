name: Publish verified Ocre Studio test build
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: publish-ocre-initial-alpha
  cancel-in-progress: false
env:
  SOURCE_RUN: '45918470164'
  SOURCE_SHA: 'b540d2752e70336573990a6f811c6f1cbfac213a'
  RELEASE_TAG: 'v0.1.0-alpha'
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Verify exact source build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actual=$(gh run view "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --json headSha,conclusion --jq '.headSha + " " + .conclusion')
          test "$actual" = "$SOURCE_SHA success"
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN }}
          pattern: ocre-*
          path: release
      - name: Verify checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m tools.release_artifacts release/ocre-linux linux --verify
          python -m tools.release_artifacts release/ocre-windows windows --verify
          gh release create "$RELEASE_TAG" release/ocre-*/* --repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Ocre Studio v0.1.0-alpha" --prerelease --notes-file - <<'NOTES'
          Primeira versão de teste do Ocre Studio, por Marinaldo da Costa Barroso Filho.

          - Windows x86_64 · instalador Setup.exe e ZIP portátil. Requer o Microsoft Edge WebView2 Runtime.
          - Linux x86_64 · Setup.run, ZIP portátil, DEB, RPM e AppImage.
          - Os pacotes incluem os pesos Kokentau autorizados e o PyTorch CPU. As somas SHA-256 acompanham os downloads.

          **Problema conhecido** — Mais de um menu da barra superior pode ficar aberto e se sobrepor. A correção do histograma está incluída. A correção dos menus segue para a próxima versão.

          Build da revisão b540d27. [Verificação no GitHub Actions](https://github.com/zxlawdx/ocre-studio/actions/runs/45918470164)
          NOTES
