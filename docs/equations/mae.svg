<svg xmlns="http://www.w3.org/2000/svg" width="410" height="100" viewBox="0 0 410 100" role="img"><title>MAE = (1/N) sum from i=1 to N of |y_i - y_hat_i|</title><rect x="0" y="0" width="410" height="100" rx="5" fill="#fafafa"/><g fill="#24292f" font-family="STIX Two Math, Cambria Math, DejaVu Serif, serif"><text x="19" y="57" font-size="25" text-anchor="start">MAE =</text><text x="130.5" y="40" font-size="22" text-anchor="middle">1</text><path d="M113 49H148" stroke="#24292f" stroke-width="1.5" fill="none"/><text x="130.5" y="74" font-size="22" text-anchor="middle">N</text><text x="180" y="60" font-size="38" text-anchor="middle">∑</text><text x="180" y="77" font-size="15" text-anchor="middle">i=1</text><text x="180" y="25" font-size="15" text-anchor="middle">N</text><text x="210" y="57" font-size="25" text-anchor="start">|yᵢ − ŷᵢ|</text></g></svg>
