<svg xmlns="http://www.w3.org/2000/svg" width="580" height="92" viewBox="0 0 580 92" role="img"><title>Y(i,j) = sum over m and n of X(i+m,j+n) K(m,n) + b</title><rect x="0" y="0" width="580" height="92" rx="5" fill="#fafafa"/><g fill="#24292f" font-family="STIX Two Math, Cambria Math, DejaVu Serif, serif"><text x="18" y="53" font-size="25" text-anchor="start">Y(i,j) =</text><text x="130" y="56" font-size="38" text-anchor="middle">∑</text><text x="130" y="73" font-size="15" text-anchor="middle">m</text><text x="179" y="56" font-size="38" text-anchor="middle">∑</text><text x="179" y="73" font-size="15" text-anchor="middle">n</text><text x="208" y="53" font-size="25" text-anchor="start">X(i+m,j+n) · K(m,n) + b</text></g></svg>
